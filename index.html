<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c2e4a">
<title>ジョイフル恵理 小倉 振袖カタログ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-header__title">ジョイフル恵理小倉<br>振袖カタログ</h1>
  <p class="site-header__subtitle">FURISODE COLLECTION</p>
</header>

<section class="controls">
  <div class="chip-row" id="colorChips"></div>
  <div class="controls-footer">
    <p class="result-count" id="resultCount"></p>
    <button type="button" class="clear-filters" id="clearFilters">条件をクリア</button>
  </div>
</section>

<main class="catalog-grid" id="catalogGrid"></main>

<button type="button" class="scroll-top" id="scrollTop" aria-label="ページトップへ戻る">↑</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal__image-wrap">
      <button type="button" class="modal__close" id="modalClose">×</button>
      <img id="modalImage" src="" alt="">
    </div>
    <div class="modal__body">
      <h2 class="modal__name" id="modalName"></h2>
      <p class="modal__price" id="modalPrice"></p>
      <div class="modal__tags" id="modalTags"></div>
      <p class="modal__description" id="modalDescription"></p>
      <a class="modal__contact" id="modalContact" href="#">この振袖について問い合わせる</a>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
